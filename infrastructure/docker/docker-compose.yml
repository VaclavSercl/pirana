services:
  pirana-engine:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: pirana-engine
    restart: unless-stopped
    environment:
      BITFINEX_API_KEY: ${BITFINEX_API_KEY:?BITFINEX_API_KEY is required}
      BITFINEX_API_SECRET: ${BITFINEX_API_SECRET:?BITFINEX_API_SECRET is required}
      PIRANA_ENV: production
      LOG_LEVEL: info
      HEALTH_CHECK_PORT: "8080"
      PIRANA_RUST_METRICS_PORT: "9100"
      PIRANA_DASHBOARD_BIND: "0.0.0.0"
      PIRANA_METRICS_BIND: "0.0.0.0"
      PIRANA_ACCOUNTING_DB: /var/lib/pirana/accounting.sqlite3
      PIRANA_ACCOUNTING_SNAPSHOT_PATH: /var/lib/pirana/accounting_snapshot.json
      PIRANA_POSITION_SNAPSHOT_PATH: /var/lib/pirana/positions.json
      CASLAV_RISK_STATE_PATH: /opt/caslav/risk/risk_state.json
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9100:9100"
    volumes:
      - pirana-data:/var/lib/pirana
      - pirana-risk:/opt/caslav/risk
    networks:
      - pirana-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pirana-prometheus
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - pirana-net

  grafana:
    image: grafana/grafana:12.1.1
    container_name: pirana-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - pirana-net

volumes:
  pirana-data:
  pirana-risk:
  prometheus-data:
  grafana-data:

networks:
  pirana-net:
    driver: bridge
