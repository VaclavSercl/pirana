# CASLAV v5.1 :: Accounting environment paths
[Service]
UMask=0077
Environment=PIRANA_ACCOUNTING_SCRIPT=scripts/pirana_accounting.py
Environment=PIRANA_ACCOUNTING_DB=/var/lib/pirana/accounting.sqlite3
Environment=PIRANA_ACCOUNTING_SNAPSHOT_PATH=/var/lib/pirana/accounting_snapshot.json
Environment=PIRANA_POSITION_SNAPSHOT_PATH=/var/lib/pirana/positions.json
