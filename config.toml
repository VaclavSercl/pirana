title = "ZeroClaw Telegram AI Configuration"

# Set the default backend text generation provider to Google Gemini
default_provider = "gemini"
# Ensure the model is correct (using Standard gemini-2.5-pro as requested or implicitly assumed)
default_model = "gemini-2.5-pro"
# Using Env-var evaluation from Node wrapper
default_temperature = 0.7

[providers]
  [providers.gemini]
  enabled = true
  api_key = "${GEMINI_API_KEY}"
  models = ["gemini-2.5-pro", "gemini-1.5-pro", "gemini-1.5-flash"]
