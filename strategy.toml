[system]
reload_interval_seconds = 60

[trading]
trade_size_btc = 0.0002
max_open_orders = 3

[strategy]
entry_zone_spread_usd = 5.0
take_profit_distance_usd = 15.0
stop_loss_distance_usd = 400.0
ofi_trigger_threshold = 0.85
ofi_window_size = 100
# HFT frekvence (2026-08-23): 20000 -> 2000 ms
# Tvrdý strop je Bitfinex: 90 orderů/min = 1,5 obchodu/s (0,67 s).
# Expektace na obchod je kladná: +0,296 sats (win rate 39,1 %, payoff 2,14),
# takže vyšší frekvence násobí zisk. 2 s ponechává ~3x rezervu k limitu burzy
# pro TP/SL a rebalance ordery, které jdou mimo tento cooldown.
#   20 s ->  4 320 obchodů/den ->  ~1 277 sats/den
#    2 s -> 43 200 obchodů/den -> ~12 772 sats/den
# POZOR: kladná expektace je podmínkou. Klesne-li pod nulu, rychlost násobí
# ztrátu — sleduj markouty a Profit Factor v denním reportu.
trade_cooldown_ms = 2000
min_confidence_score = 0.95

[inventory]
min_inventory_btc = 0.0001
max_inventory_btc = 0.05
# Cilovy inventar: PODIL obchodovatelne equity drzeny v BTC (v procentech).
#
# ZMENA 24. 8. 2026 — pevna konstanta vysala celou penezenku
# ------------------------------------------------------------------
# Drive platilo target_inventory_btc = 0.01 (pevne cislo v BTC).
# Pri cene 77 978 USD to bylo 779,78 USD = 196 % cele equity (396,96 USD).
#
# Avellaneda-Stoikov pocita q = (btc - trezor) - target. Kdyz je cil vetsi
# nez cely kapital, zustava q trvale zaporne, coz naklani kotace k nakupu.
# Bot proto nakupoval, dokud nevycerpal fiat na 0,29 USD a burza nezacala
# odmitat objednavky: error 10001 "not enough exchange balance".
#
# Alokace se posunula z rannich 8,7 % BTC na 99,9 % za jedno dopoledne.
# To NENI akumulace ze zisku — tu obstarava [profit_skimmer] (10 % z PnL).
# Tohle byla konverze celeho kapitalu, ktera bota pripravila o schopnost
# nakupovat. Market making potrebuje obe strany.
#
# Nove je cil PODIL equity, takze se sam prizpusobi velikosti uctu i cene.
# Trezor se do equity nepocita, takze nastradane satoshi cil nezvysuji
# a akumulace ze zisku bezi nezavisle na tomto nastaveni.
#
#   30 % pri equity 397 USD -> target 0,001527 BTC (119 USD)
#                              fiat zbyva 278 USD na nakupy
#
# target_inventory_btc nize zustava jen jako zaloha pro pripad,
# ze by target_inventory_pct bylo 0 nebo zaporne.
target_inventory_pct = 30.0
target_inventory_btc = 0.01
use_dynamic_inventory = true

[risk_management]
max_slippage_bps = 5
position_size_pct = 20.0
max_aggregate_exposure_pct = 90.0
max_single_trade_risk_pct = 5.0
# daily_loss_limit_usd odstraněno 24.8. — risk engine používá daily_loss_limit_sats (kalibrované).
use_dynamic_winrate_sizing = true
min_position_size_pct = 5.0
max_position_size_pct = 25.0

[volatility]
use_dynamic_atr = true
atr_period = 14
ticks_per_bar = 50
atr_tp_multiplier = 0.4
atr_sl_multiplier = 2.5
min_tp_usd = 10.0
max_tp_usd = 300.0
min_sl_usd = 350.0
max_sl_usd = 1200.0

[order_book]
use_l2_depth_imbalance = true
l2_depth_levels = 5
l2_weight_decay = 0.5
l2_weight_alpha = 0.40
min_l2_imbalance_threshold = 0.15

[trailing_stop]
enabled = true
min_trigger_usd = 10.0
be_offset_usd = 2.0
trail_multiplier = 0.5

[profit_skimmer]
enabled = true
# 10 % z každého zisku ze spreadu se natrvalo uzamkne do BTC trezoru
btc_lock_pct = 10.0
# Uzamčené BTC se odečte z volné marže a bot na něj nikdy nesáhne
exclude_from_trading_margin = true

[adaptive_cooldown]
enabled = true
# Adaptivní rozpětí (2026-08-23): 8000-60000 -> 1000-20000 ms
# min_ms = 1000: nejsilnější signál (composite >= 0,85) smí obchodovat 1x/s,
#   stále 1,5x pod limitem burzy.
# max_ms = 20000: nejslabší signál čeká 20 s (dřívější základní cooldown).
min_ms = 1000
max_ms = 20000

[lead_lag]
enabled = true
binance_enabled = true
coinbase_enabled = true
# Minimální cenový rozdíl v USD mezi Leader trhy (Binance + Coinbase) a Bitfinexem
min_lead_disparity_usd = 15.0
velocity_window_ms = 250
weight_binance = 0.65
weight_coinbase = 0.35
min_confidence_score = 0.95

[hawkes_process]
enabled = true
# Koeficient excitace intenzity při příchodu agresivní objednávky
alpha = 0.8
# Míra exponenciálního rozpadu intenzity (decay rate)
beta = 1.2
# Z-Score práh pro detekci kaskádových likvidací (Cascade Avalanche)
zscore_threshold = 2.5
# Časové okno pro shlukování toku v milisekundách
window_ms = 1000
baseline_mu = 0.1

[vpin_guard]
enabled = true
# Velikost objemového koše v BTC.
#
# KALIBRACE (2026-08-23): 0.5 -> 5.0
# Koš 0,5 BTC byl 190x menší, než předepisuje standard (Easley/Lopez de Prado/
# O'Hara: 1/50 denního objemu = ~95 BTC na tBTCUSD). Naměřeno na burze:
# průtok 3,31 BTC/min, medián obchodu 0,00129 BTC, max 1,11 BTC.
# Koš 0,5 BTC pojal jen 22 obchodů a naplnil se za 9 s; jediný velký taker
# (3,5 % obchodů má >= 0,25 BTC) ho zaplnil z poloviny jedním směrem.
#
# Simulace při DOKONALE VYVÁŽENÉM toku (50 % buy / 50 % sell), 300 běhů:
#     koš 0,5 BTC ->  VPIN 0,557   (emergency práh 0,75 => trvalé blokování)
#     koš 2,0 BTC ->  VPIN 0,361
#     koš 5,0 BTC ->  VPIN 0,230   <- zvoleno
#     koš 25  BTC ->  VPIN 0,104   (už necitlivý na skutečnou toxicitu)
#
# VPIN tedy neměřil toxicitu toku, ale granularitu košů. Důsledek: 251
# emergency alertů za den a 3,5 h zastaveného obchodování 23. 8. od 13:06.
# 5,0 BTC = 217 obchodů na koš, naplní se za ~91 s — dost na vyhlazení šumu,
# stále dost citlivé na reálný jednosměrný tok.
#
# REVIZE 17:50 — VOLBA 5,0 BTC BYLA CHYBNA, OPRAVENO NA 2,0
#
# Puvodne jsem vybral kos podle nejnizsi sumove podlahy. To je spatne
# kriterium: s sumem se vytrati i signal. Zmereno na 450 000 realnych
# obchodech z Bitfinexu, AUC = jak dobre VPIN predpovi pohyb ceny
# v nasledujicich 300 s (0,50 = nahoda):
#
#     kos   AUC    korelace  plni se   okno 50 kosu
#     0,5   0,610    0,190       9 s       7,6 min
#     2,0   0,626    0,205      36 s      30,2 min   <- ZVOLENO
#     5,0   0,559    0,112      91 s      75,5 min   <- NEJHORSI ze vsech
#      10   0,588    0,106     181 s     151,1 min
#      25   0,652    0,186     453 s     377,6 min
#
# Kos 5,0 BTC ma nejnizsi predikcni silu (AUC 0,559, sotva nad nahodou)
# i nejnizsi korelaci. Kos 25 BTC ma sice nejlepsi AUC 0,652, ale okno
# 50 kosu = 6,3 hodiny; pri cooldownu 2 s je to jako ridit podle vcerejsi
# predpovedi pocasi — nez metrika zareaguje, epizoda toxicity skoncila.
#
# 2,0 BTC: AUC 0,626 (druha nejlepsi), okno 30 min, median VPIN 0,473
# bezpecne pod prahem 0,65. Nejlepsi pomer informace k reakcni dobe.
bucket_size_btc = 2.0
# Počet košů v klouzavém okně
bucket_count = 50
# Práh toxicity pro blokování protisměrných obchodů (Adverse Selection Guard)
toxicity_threshold = 0.65
# Okamžité storno visících pasivních limitů při extrémní toxicitě (> 75 %)
emergency_cancel_on_toxic = true

[avellaneda_stoikov]
enabled = true
risk_aversion_gamma = 0.10
order_book_liquidity_kappa = 1.50
time_horizon_dt = 1.0


